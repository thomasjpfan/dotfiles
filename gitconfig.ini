[core]
    autocrlf = input
    editor = nvim
[user]
	name = Thomas J. Fan
	email = thomasjpfan@gmail.com
    signingkey = E92E38C3C60FE60FD23FC26763DDF1F05E99D6B7
[push]
	default = simple
	autoSetupRemote = true
[alias]
    slog = log --oneline --topo-order --graph
    ds = difftool --staged      # git ds - diff your staged changes == review before committing.
    u = "!f() { git add --update \"$@\" && git status; }; f"
    git = !git
[branch]
    autosetuprebase = always
    autoSetupMerge = false
	sort = -committerdate
[color]
    ui = true
[commit]
	gpgsign = true
	verbose = true
[fetch]
	parallel = 0
	prune = true
	pruneTags = true
	all = true
[init]
	defaultBranch = main
[delta]
    navigate = true
    line-numbers = true
    hyperlinks = true
[pager]
    diff = delta
    log = delta
    reflog = delta
    show = delta
[interactive]
    diffFilter = delta --color-only --features=interactive
[sequence]
	editor = interactive-rebase-tool
[pull]
    ff = only
	rebase = true
[rebase]
	autoSquash = true
	autoStash = true
	updateRefs = true
[help]
	autoCorrect = prompt
[advice]
	statusHints = false
[rerere]
	enabled = true
	autoupdate = true
[http]
	postBuffer = 157286400
[column]
	ui = auto
[tag]
	sort = version:refname
